<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family:'Tajawal'; font-weight:800; font-display:block;
    src:url('assets/fonts/tajawal-800-arabic.woff2') format('woff2'); }
  @font-face { font-family:'Tajawal'; font-weight:700; font-display:block;
    src:url('assets/fonts/tajawal-700-arabic.woff2') format('woff2'); }
  @font-face { font-family:'Tajawal'; font-weight:500; font-display:block;
    src:url('assets/fonts/tajawal-500-arabic.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:'Tajawal',sans-serif;
    width:1200px; height:630px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(169,206,46,0.30), transparent 55%),
      linear-gradient(160deg, #1A4B9C 0%, #123567 100%);
  }
  /* subtle corner glows */
  body::before { content:''; position:absolute; bottom:-180px; left:-120px;
    width:480px; height:480px; border-radius:50%;
    background:radial-gradient(circle, rgba(169,206,46,0.18), transparent 70%); }
  .logo { width:200px; height:200px; border-radius:50%;
    background:rgba(255,255,255,0.96); padding:10px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); border:4px solid rgba(169,206,46,0.6);
    margin-bottom:34px; }
  .name { font-weight:800; font-size:62px; line-height:1.15; }
  .sub { font-weight:700; font-size:40px; color:#C2E04A; margin-top:6px; }
  .divider { width:120px; height:5px; border-radius:3px; background:#A9CE2E; margin:26px 0; }
  .tag { font-weight:500; font-size:30px; color:rgba(255,255,255,0.9); letter-spacing:0.5px; }
</style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="logo" />
  <div class="name">عالم الإبداع المتطورة</div>
  <div class="sub">للمقاولات العامة</div>
  <div class="divider"></div>
  <div class="tag">كل مناطق المملكة &nbsp;·&nbsp; 24 ساعة &nbsp;·&nbsp; أوراق رسمية معتمدة</div>
</body>
</html>
